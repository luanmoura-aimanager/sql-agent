[pytest]
# pytest-asyncio: mode auto = funções async viram async tests sem
# decorator individual. Match com o pattern do conftest.py.
asyncio_mode = auto

# Loop scope das fixtures async session-scoped — sem isso, pytest-asyncio
# 0.23+ avisa que cada teste cria seu próprio event loop e fixtures
# session-scoped não persistem.
asyncio_default_fixture_loop_scope = session

# Loop scope dos próprios testes — precisa casar com o das fixtures
# session-scoped. Sem isso, o engine async (criado no loop da sessão) é
# usado por um teste rodando em loop function-scoped → asyncpg explode com
# "got Future attached to a different loop". pytest-asyncio 0.24+.
asyncio_default_test_loop_scope = session

# Coleta escopada SÓ pro diretório tests/ (suite nova desta sessão).
# Não usar `.`: a raiz tem scripts interativos nomeados test_*.py
# (test_tool.py, test_langchain.py) que chamam input() no nível do módulo
# — coletá-los trava a coleta com "OSError: reading from stdin while
# output is captured". Os testes de regressão legados (test_rate_limit.py,
# test_xff_trust.py, test_structured_logging.py) continuam rodando por
# nome explícito, como sempre fizeram (ver CLAUDE.md). Misturá-los aqui
# expõe uma poluição de env pré-existente entre eles (db.py faz
# load_dotenv no import → injeta API_TOKEN do .env → o token hardcoded
# em test_structured_logging.py deixa de bater). Fora do escopo de D-2.
testpaths = tests
