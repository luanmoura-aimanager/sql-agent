[pytest]
# pytest-asyncio: mode auto = funções async viram async tests sem
# decorator individual. Match com o pattern do conftest.py.
asyncio_mode = auto

# Loop scope das fixtures async session-scoped — sem isso, pytest-asyncio
# 0.23+ avisa que cada teste cria seu próprio event loop e fixtures
# session-scoped não persistem.
asyncio_default_fixture_loop_scope = session

# Loop scope dos próprios testes — precisa casar com o das fixtures
# session-scoped. Sem isso, o engine async (criado no loop da sessão) é
# usado por um teste rodando em loop function-scoped → asyncpg explode com
# "got Future attached to a different loop". pytest-asyncio 0.24+.
asyncio_default_test_loop_scope = session

# Alvos de coleta EXPLÍCITOS: o dir tests/ (suite nova) + os testes de
# regressão legados por nome. NÃO usar `.` — a raiz tem scripts interativos
# nomeados test_*.py (test_tool.py, test_langchain.py) que chamam input()
# no nível do módulo; coletá-los trava a coleta com "OSError: reading from
# stdin while output is captured". Listar arquivos evita isso e mantém a
# suite de regressão rodando no `pytest` puro.
#
# Antes, misturar tests/ com os legados expunha poluição de env entre eles,
# mas isso foi resolvido nesta sessão: test_structured_logging.py agora
# deriva o Bearer token do env (não hardcoda) e alembic/env.py usa
# fileConfig(disable_existing_loggers=False) pra não matar o logger do app.
# Sessão combinada passa 32/32.
testpaths = tests test_rate_limit.py test_xff_trust.py test_structured_logging.py
